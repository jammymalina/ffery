[package]
name = "ffery"
version = "0.12.0"
edition = "2024"

authors = ["Jakub Jantosik <jakub.jantosik@gmail.com>"]
description = "A file manipulation cli. Made for me by me."
license = "MIT"
readme = "README.md"
repository = "https://github.com/jammymalina/ffery"
keywords = ["cli", "utility", "file-management"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.4"
metaflac = { version = "0.2.8", features = ["serde"] }
mustache = "0.9.0"
phf = { version = "0.13.1", features = ["macros"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3.20.0", features = ["macros"] }
zip = "8.6.0"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
